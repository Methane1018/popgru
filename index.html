<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf2f8">
<title>POPGRU — 壓扁格魯</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐧</text></svg>">
<style>
  :root{
    --bg:#eaf2f8; --bg-2:#d7e6f1; --ink:#16242f; --muted:#65798a;
    --card:#fff; --line:#c9dae7; --accent:#1f6ea8; --accent-ink:#fff;
    --shadow:rgba(24,60,88,.20); --sheet:#fff;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1a22; --bg-2:#152532; --ink:#e8f2f9; --muted:#8ba3b6;
      --card:#182734; --line:#26404f; --accent:#5fb3e8; --accent-ink:#06121b;
      --shadow:rgba(0,0,0,.45); --sheet:#152430;
    }
  }
  body.visiting{ --bg:#f6efe6; --bg-2:#ecdfcd; }
  @media (prefers-color-scheme:dark){ body.visiting{ --bg:#1d1a14; --bg-2:#2a241a; } }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0; min-height:100dvh; color:var(--ink);
    /* 三層：表情符號平鋪 → 顏色薄膜 → 原本的底色漸層。
       薄膜用半透明疊在現有底色上，所以亮色和深色模式都不會壞掉，
       不必為每個背景各寫一套配色。 */
    background:
      var(--skin-tile, none),
      var(--skin-wash, none),
      radial-gradient(120% 90% at 50% 0%,var(--bg) 0%,var(--bg-2) 100%);
    background-repeat:repeat, no-repeat, no-repeat;
    background-attachment:fixed, fixed, fixed;
    font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",
                "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
  }

  /* ---------- 身分列 ---------- */
  .top{width:min(540px,100%); display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:34px}
  .brand{appearance:none; border:0; background:none; font-family:inherit;
         font-size:11px; font-weight:800; letter-spacing:.32em; color:var(--muted);
         padding:4px 6px 4px .32em; cursor:pointer; border-radius:8px;
         display:inline-flex; align-items:center; gap:6px}
  .brand:hover{color:var(--ink)}
  .brand:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .ver{font-size:10px; font-weight:700; letter-spacing:.04em; opacity:.75;
       font-variant-numeric:tabular-nums}
  /* 有沒看過的新版本時，版本號旁邊點一個小點 */
  .brand.fresh .ver{color:var(--accent); opacity:1}
  .brand.fresh .ver::after{content:''; display:inline-block; width:5px; height:5px;
         margin-left:4px; border-radius:50%; background:var(--accent); vertical-align:middle}

  /* 更新紀錄 */
  .rel{padding:12px 2px; border-bottom:1px solid var(--line)}
  .rel:last-child{border-bottom:0}
  .rel-head{display:flex; align-items:baseline; gap:8px; margin-bottom:6px}
  .rel-v{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums}
  .rel-v.now{color:var(--accent)}
  .rel-date{font-size:11.5px; color:var(--muted); font-weight:600}
  .rel-tag{font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--accent-ink);
           background:var(--accent); border-radius:99px; padding:2px 7px}
  .rel ul{margin:0; padding-left:18px}
  .rel li{font-size:14px; margin:4px 0; line-height:1.6}
  .who{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600}
  .who-name{color:var(--ink); max-width:9em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .who-hint{color:var(--muted); font-weight:600}
  .avatar{width:24px; height:24px; border-radius:50%; object-fit:cover; background:var(--line)}
  .link{appearance:none; background:none; border:0; color:var(--muted); font:inherit; font-size:12px;
        text-decoration:underline; cursor:pointer; padding:2px}

  /* ---------- 主體 ---------- */
  .wrap{width:min(540px,100%); display:flex; flex-direction:column; align-items:center; flex:1}
  .count-label{font-size:12px; color:var(--muted); font-weight:700; margin-top:6px; letter-spacing:.04em}
  .count{font-size:clamp(42px,13vw,80px); font-weight:900; line-height:1.05; letter-spacing:-.03em;
         font-variant-numeric:tabular-nums}
  .count.bump{animation:bump .18s cubic-bezier(.3,1.6,.5,1)}

  /* ---------- 外觀 ---------- */
  body[data-bg="sunset"]{--skin-wash:linear-gradient(rgba(255,138,64,.17),rgba(255,138,64,.17))}
  body[data-bg="mint"]  {--skin-wash:linear-gradient(rgba(40,205,150,.17),rgba(40,205,150,.17))}
  body[data-bg="grape"] {--skin-wash:linear-gradient(rgba(150,110,240,.17),rgba(150,110,240,.17))}
  body[data-bg="night"] {--skin-wash:linear-gradient(rgba(16,26,56,.34),rgba(16,26,56,.34))}

  body[data-font="mono"]    .count{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:-.01em}
  /* 原本用 --line / --bg-2 當陰影色，那兩個跟背景幾乎同色，等於看不見。
     改成用強調色做多層擠出，亮暗兩種模式都看得出來。 */
  body[data-font="shadow"]  .count{
    text-shadow:1px 1px 0 var(--accent), 2px 2px 0 var(--accent), 3px 3px 0 var(--accent),
                4px 4px 0 var(--accent), 5px 5px 0 var(--accent), 7px 8px 12px var(--shadow)}
  body[data-font="glow"]    .count{color:var(--accent); text-shadow:0 0 18px var(--accent), 0 0 44px var(--accent)}
  body[data-font="gold"]    .count{background:linear-gradient(180deg,#ffe9a3,#d4a017 55%,#8a6207);
                                   -webkit-background-clip:text; background-clip:text; color:transparent;
                                   text-shadow:none; filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
  body[data-font="rainbow"] .count{background:linear-gradient(90deg,#ff5f6d,#ffc371,#47e08a,#4facfe,#c471ed);
                                   -webkit-background-clip:text; background-clip:text; color:transparent}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}

  .bar{width:100%; max-width:340px; margin-top:6px}
  .bar-track{height:5px; border-radius:99px; background:var(--line); overflow:hidden}
  .bar-fill{height:100%; background:var(--accent); border-radius:99px}
  .bar-text{font-size:11px; color:var(--muted); text-align:center; margin-top:5px; font-weight:600}

  .gru-head{display:flex; align-items:baseline; gap:8px; margin-top:14px}
  .gru-name{appearance:none; background:none; border:0; font:inherit; color:var(--ink);
            font-size:19px; font-weight:800; cursor:pointer; padding:2px 4px; border-radius:8px}
  .gru-name:hover{background:var(--line)}
  .gru-count{font-size:13px; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums}
  .gru-owner{font-size:12px; color:var(--muted); font-weight:600; margin-top:1px; min-height:16px}

  /* ---------- 舞台 ---------- */
  .stage-wrap{width:100%; max-width:420px}
  /* margin-top 是 stage-wrap 寬度的百分比，所以帽子的預留空間會跟著等比縮放 */
  .stage{position:relative; width:100%; aspect-ratio:1629/1302; margin-top:10%;
         cursor:pointer; touch-action:manipulation; container-type:inline-size}
  .stage:focus-visible{outline:3px solid var(--accent); outline-offset:6px; border-radius:18px}
  .stage img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
             object-position:center bottom; -webkit-user-drag:none; pointer-events:none;
             filter:var(--skin-tint, none)}
  .hide{visibility:hidden}

  /* 地面陰影，跟著姿勢硬切，不做過場 */
  .shadow{position:absolute; left:50%; bottom:1.2%; transform:translateX(-50%);
          background:radial-gradient(50% 50% at 50% 50%,var(--shadow) 0%,transparent 72%); pointer-events:none}
  .shadow.tall{width:34%; height:3.4%}
  .shadow.flat{width:50%; height:3.0%}

  /* 帽子。錨點是從去背圖的眼睛座標算出來的，兩個姿勢都對得上 */
  .hat{position:absolute; left:50.4%; line-height:1; pointer-events:none;
       font-size:84px; transform:translate(-50%,-52%)}
  @supports (font-size:1cqw){ .hat{font-size:20cqw} }
  .hat.tall{top:1.6%}
  .hat.flat{top:28.9%}
  .hat.stuck{transform:translate(-30%,-30%) rotate(38deg)}

  /* 手持物。錨點取自去背圖的翅膀尖端，稍微往內收一點才不會超出畫面。 */
  .hold{position:absolute; line-height:1; pointer-events:none;
        font-size:60px; transform:translate(-50%,-50%) rotate(-16deg)}
  @supports (font-size:1cqw){ .hold{font-size:15cqw} }
  /* 翅膀尖在畫布最邊緣（98.7%/95.2%），道具擺在那裡會被切掉，
     所以往內收到 80%，看起來仍然是「拿在翅膀上」。 */
  .hold.tall{left:80%; top:52%}
  .hold.flat{left:80%; top:58%}
  .hold.stuck{transform:translate(-50%,-10%) rotate(-70deg)}

  .last{font-size:12px; color:var(--muted); font-weight:600; min-height:17px; margin-top:2px; text-align:center}
  .hint{font-size:13px; color:var(--muted); font-weight:600; min-height:18px}

  .stats{display:flex; gap:14px; font-size:14px; font-weight:800; margin-top:6px;
         font-variant-numeric:tabular-nums}
  .stats.extra{font-size:12px; font-weight:700; color:var(--muted); gap:0; min-height:16px; margin-top:2px}

  /* ---------- 導覽 ---------- */
  .nav{width:min(540px,100%); display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:12px}
  .btn{appearance:none; border:1px solid var(--line); background:var(--card); color:var(--ink);
       font:inherit; font-size:13px; font-weight:700; padding:8px 13px; border-radius:999px;
       cursor:pointer; line-height:1; white-space:nowrap}
  .btn:hover:not(:disabled){border-color:var(--accent)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:disabled{opacity:.4; cursor:default}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .btn.small{font-size:12px; padding:6px 11px}
  .btn.alert{border-color:var(--accent); color:var(--accent)}

  /* ---------- 面板 ---------- */
  .scrim{position:fixed; inset:0; background:rgba(10,25,35,.45); opacity:0; pointer-events:none; z-index:20}
  .scrim.open{opacity:1; pointer-events:auto}
  .sheet{position:fixed; left:50%; bottom:0; transform:translate(-50%,100%);
         width:min(540px,100%); max-height:82dvh; background:var(--sheet); z-index:21;
         border-radius:20px 20px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.22);
         display:flex; flex-direction:column; transition:transform .22s ease}
  .sheet.open{transform:translate(-50%,0)}
  .sheet-top{display:flex; align-items:center; justify-content:space-between;
             padding:14px 16px 8px; border-bottom:1px solid var(--line)}
  .sheet-top h2{margin:0; font-size:16px; font-weight:800}
  .sheet-body{overflow-y:auto; padding:10px 14px calc(20px + env(safe-area-inset-bottom));
              display:flex; flex-direction:column; gap:8px; -webkit-overflow-scrolling:touch}

  .row{display:flex; align-items:center; gap:11px; padding:9px 4px; border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row-av{width:36px; height:36px; border-radius:50%; background:var(--bg-2); flex:0 0 36px;
          display:grid; place-items:center; font-size:19px; overflow:hidden}
  .row-av.big{font-size:22px; background:transparent}
  .row-av img{width:100%; height:100%; object-fit:cover}
  .row-mid{flex:1; min-width:0}
  .row-title{font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row-sub{font-size:12px; color:var(--muted); font-weight:600; margin-top:2px;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .was{font-size:11px; color:var(--muted); font-weight:600; text-decoration:line-through}
  .row-acts{display:flex; gap:6px; flex:0 0 auto}

  .note{font-size:13px; color:var(--muted); font-weight:700; margin:2px 4px 4px}
  .empty{font-size:13px; color:var(--muted); font-weight:600; text-align:center; padding:26px 12px; line-height:1.6}
  .sub-h{font-size:13px; font-weight:800; color:var(--muted); margin:14px 4px 2px}
  .input{width:100%; font:inherit; font-size:15px; padding:10px 12px; border-radius:12px;
         border:1px solid var(--line); background:var(--bg); color:var(--ink)}
  .grid{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0}
  /* 裝扮的分類切換 */
  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 6px}
  .tab{appearance:none; border:1px solid var(--line); background:var(--card); color:var(--muted);
       font:inherit; font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:999px;
       cursor:pointer; line-height:1}
  .tab.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

  /* 圖鑑 */
  .dex{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; margin:4px 0}
  .dex-cell{border:1px solid var(--line); border-radius:12px; padding:9px 6px; text-align:center;
            background:var(--card); display:flex; flex-direction:column; align-items:center; gap:3px}
  .dex-cell.got{border-width:2px}
  .dex-icon{font-size:26px; line-height:1.1}
  .dex-cell.locked .dex-icon{filter:grayscale(1) opacity(.35)}
  .dex-name{font-size:12px; font-weight:800; line-height:1.25}
  .dex-cell.locked .dex-name{color:var(--muted); font-weight:700}
  .dex-sub{font-size:10.5px; color:var(--muted); line-height:1.4}
  .dex-rar{font-size:9.5px; font-weight:800; letter-spacing:.06em; padding:1px 6px;
           border-radius:99px; color:#fff}
  .dex-buy{appearance:none; border:0; border-radius:99px; background:var(--accent);
           color:var(--accent-ink); font:inherit; font-size:11px; font-weight:800;
           padding:4px 9px; cursor:pointer; margin-top:2px}
  .dex-cell[role=button]{cursor:pointer}
  .dex-cell[role=button]:hover{border-color:var(--accent)}
  .dex-cell:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .dex-detail{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 0 6px}
  .dex-detail-icon{font-size:56px; line-height:1}
  .dex-detail-icon.locked{filter:grayscale(1) opacity(.35)}
  .dex-detail-name{font-size:19px; font-weight:800}
  .dex-detail-tags{display:flex; gap:6px}
  .dex-rar.src{background:var(--muted) !important}
  .dex-line{font-size:14.5px; line-height:1.7; margin:0 4px 6px}

  /* ── 技能樹 ── */
  .sk-sum{text-align:center; padding:10px 0 2px}
  .sk-sp{font-size:40px; font-weight:800; line-height:1; color:var(--accent)}
  .sk-sp-label{font-size:12px; color:var(--muted); margin-top:3px}
  .sk-axis{margin:14px 0 4px}
  .sk-head{display:flex; align-items:baseline; gap:6px; margin-bottom:6px; flex-wrap:wrap}
  .sk-head b{font-size:14.5px}
  .sk-head .sk-blurb{font-size:11.5px; color:var(--muted)}
  .sk-path{display:grid; grid-template-columns:repeat(4,1fr); gap:5px}
  .sk-node{border:1px solid var(--line); border-radius:12px; padding:8px 4px; text-align:center;
           background:var(--card); cursor:pointer; position:relative}
  /* 用細線把同一條軸串起來，看得出是一條路而不是四個獨立的東西 */
  .sk-node + .sk-node::before{content:''; position:absolute; left:-5px; top:50%;
           width:5px; height:1px; background:var(--line)}
  .sk-icon{font-size:21px; line-height:1.15}
  .sk-name{font-size:11.5px; font-weight:800; line-height:1.3; margin-top:2px}
  .sk-cost{font-size:10px; color:var(--muted); margin-top:2px}
  .sk-node.got{border-width:2px}
  /* 學不起的節點灰掉但仍然看得見名字 —— 「知道那裡有東西」就是深度本身 */
  .sk-node.locked .sk-icon{filter:grayscale(1) opacity(.3)}
  .sk-node.locked .sk-name{color:var(--muted)}
  .sk-node.ready{box-shadow:inset 0 0 0 2px var(--accent)}
  /* 路已經通了、只差點數 —— 要跟「前置還沒學」看得出差別，那是下一個目標 */
  .sk-node.near{border-style:dashed; border-color:var(--accent)}
  .sk-node.near .sk-icon{filter:grayscale(.55) opacity(.6)}
  .sk-node.near .sk-cost{color:var(--accent); font-weight:800}
  .sk-node:hover{border-color:var(--accent)}
  .sk-node:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .btn.danger{background:#c0392b; color:#fff; border-color:#c0392b}
  .dex-line.ok{color:var(--accent); font-weight:800}
  .dex-sum{font-size:12.5px; color:var(--muted); line-height:1.7; margin:2px 4px 8px}
  .dex-sum b{color:var(--ink)}
  .emoji-btn{appearance:none; width:52px; height:52px; font-size:26px; line-height:1; cursor:pointer;
             border-radius:14px; border:1px solid var(--line); background:var(--card)}
  .emoji-btn.on{border-color:var(--accent); background:var(--bg-2); box-shadow:0 0 0 2px var(--accent) inset}
  .emoji-btn.locked{opacity:.3; cursor:default}
  .emoji-btn.poor{opacity:.55}          /* 買得到，但魚不夠 */
  .skin-btn{appearance:none; min-width:92px; padding:11px 13px; font:inherit; font-size:13px;
            font-weight:700; cursor:pointer; border-radius:12px; border:1px solid var(--line);
            background:var(--card); color:var(--ink); text-align:center}
  .skin-btn.on{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset}
  .skin-btn.locked{opacity:.35; cursor:default}
  .skin-btn.poor{opacity:.55}
  /* 底部確認列：真正花錢的按鈕只出現在這裡 */
  .skin-bar{position:sticky; bottom:0; margin-top:10px; padding:12px 2px calc(8px + env(safe-area-inset-bottom));
            background:var(--sheet); border-top:1px solid var(--line);
            display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .skin-bar-note{flex:1; min-width:140px; font-size:12.5px; color:var(--muted); font-weight:600; line-height:1.5}

  /* 提示固定在標題列正下方。放在畫面底部會蓋住商店／信箱那排按鈕，
     放在這裡最多只擋到一行說明文字，而且面板打開時也不會擋到內容。 */
  /* 預覽罩：透明但吃掉所有點擊，所以預覽時按不到企鵝也按不到下面那排 */
  .preview-veil{position:fixed; inset:0; z-index:25; display:flex;
                align-items:flex-end; justify-content:center;
                padding-bottom:calc(20px + env(safe-area-inset-bottom)); cursor:pointer}
  .preview-bar{display:flex; align-items:center; gap:10px; max-width:92vw;
               background:var(--ink); color:var(--bg); border-radius:999px;
               padding:9px 10px 9px 16px; font-size:13px; font-weight:700;
               box-shadow:0 8px 28px rgba(0,0,0,.32)}
  .preview-bar button{appearance:none; border:0; border-radius:999px; padding:7px 13px;
                      font:inherit; font-size:12px; font-weight:800; cursor:pointer;
                      background:var(--bg); color:var(--ink); white-space:nowrap}

  .toast{position:fixed; left:50%; top:calc(46px + env(safe-area-inset-top));
         transform:translate(-50%,-14px); z-index:30; max-width:min(440px,92vw);
         background:var(--ink); color:var(--bg); font-size:13px; font-weight:700;
         padding:11px 16px; border-radius:999px; text-align:center;
         opacity:0; pointer-events:none; transition:opacity .18s, transform .18s}
  .toast.show{opacity:1; transform:translate(-50%,0)}

  .writefail{width:min(540px,100%); margin-top:8px; padding:9px 13px; border-radius:10px;
             background:#8a2b2b; color:#fff; font-size:12.5px; font-weight:700; line-height:1.5;
             text-align:center}
  .hint-sm{font-size:12.5px; color:var(--muted); line-height:1.55; margin:2px 4px 10px}
  .hat-cell{display:flex; flex-direction:column; align-items:center; gap:3px; width:60px}
  .cell-name{font-size:10.5px; font-weight:700; line-height:1.25; text-align:center;
             color:var(--ink); word-break:keep-all}
  .hat-need{font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; opacity:.75}

  .loading{position:fixed; inset:0; display:grid; place-items:center; z-index:40;
           background:var(--bg); color:var(--muted); font-weight:700; font-size:14px}
</style>
</head>
<body>

<div class="loading" id="loading">載入格魯中…</div>

<header class="top">
  <button class="brand" id="brand" type="button" title="看更新了什麼">
    POPGRU <span class="ver" id="ver"></span>
  </button>
  <div class="who" id="who"></div>
</header>

<div class="writefail" id="writefail" hidden></div>

<main class="wrap">
  <div class="count-label" id="countLabel">你總共壓了</div>
  <div class="count" id="count">0</div>

  <div class="bar" id="bar" hidden>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="bar-text" id="barText"></div>
  </div>

  <div class="gru-head">
    <button class="gru-name" id="gruName" title="幫格魯取名 / 看誰來過">格魯</button>
    <span class="gru-count" id="gruCount">0 下</span>
  </div>
  <div class="gru-owner" id="gruOwner"></div>

  <div class="stage-wrap">
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="壓扁格魯">
    <div class="shadow tall" id="shadow"></div>
    <img id="imgTall" src="src/penguin-tall-cutout.png" alt="站著的格魯" fetchpriority="high">
    <img id="imgFlat" src="src/penguin-flat-cutout.png" alt="被壓扁的格魯" class="hide" fetchpriority="high">
    <div class="hat tall" id="hat" hidden></div>
    <div class="hold tall" id="hold" hidden></div>
  </div>
  </div>

  <div class="last" id="lastSquasher"></div>
  <div class="hint" id="hint">點一下格魯</div>

  <div class="stats">
    <span id="statStreak">🔥 0 天</span>
    <span id="statFish">🐟 0</span>
    <span id="statMine">⭐️ 0</span>
  </div>
  <div class="stats extra" id="statExtra"></div>
</main>

<nav class="nav">
  <button class="btn" id="navHome" type="button" hidden>🏠 回家</button>
  <button class="btn" id="navPeople" type="button">👥 大家</button>
  <button class="btn" id="navItems" type="button">🎁 道具</button>
  <button class="btn" id="navWardrobe" type="button">🎨 裝扮</button>
  <button class="btn" id="navCodex" type="button">📖 圖鑑</button>
  <button class="btn" id="navSkills" type="button">🌳 技能</button>
  <button class="btn" id="navInbox" type="button">📭</button>
  <button class="btn" id="shareBtn" type="button" hidden>🔗 分享</button>
  <button class="btn" id="sound" type="button" aria-pressed="true">🔊</button>
</nav>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-top">
    <h2 id="sheetTitle"></h2>
    <button class="btn small" id="sheetClose" type="button" aria-label="關閉">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</aside>

<!-- 預覽外觀時蓋住全畫面：擋掉所有操作，只留「結束預覽」。
     不然商店面板會把企鵝整個遮住，根本看不到自己在預覽什麼。 -->
<div class="preview-veil" id="previewVeil" hidden>
  <div class="preview-bar">
    <span id="previewWhat">預覽中</span>
    <button id="previewExit" type="button">結束預覽</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js?v=0.10.0"></script>
</body>
</html>
